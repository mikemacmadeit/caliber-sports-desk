[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "caliber"
version = "0.1.0"
description = "Odds-aware calibrated probability engine for NFL and FBS college football."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary — private research" }
authors = [{ name = "Caliber Research" }]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "httpx>=0.27.0",
  "numpy>=2.1.0",
  "pandas>=2.2.0",
  "pyarrow>=17.0.0",
  "python-dotenv>=1.0.1",
  "orjson>=3.10.0",
  "structlog>=24.4.0",
  "openai>=1.80.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.8.0",
]
postgres = [
  "psycopg[binary]>=3.2.0",
]

[tool.setuptools.packages.find]
where = ["packages/core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["packages/core", "services/api"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages/core", "services/api", "services/worker", "infra", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
