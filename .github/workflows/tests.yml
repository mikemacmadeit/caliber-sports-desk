name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: caliber_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-ci-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:local-ci-test@127.0.0.1:5432/caliber_test
      TEST_POSTGRES_URL: postgresql+psycopg://postgres:local-ci-test@127.0.0.1:5432/caliber_test
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -c constraints.txt -e ".[dev,postgres,research]"
      - name: Migrate clean PostgreSQL
        run: python -m alembic -c infra/alembic.ini upgrade head
      - name: Test
        run: python -m pytest -q
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: node --test tests/web_contracts.cjs
      - run: npm run web:build
