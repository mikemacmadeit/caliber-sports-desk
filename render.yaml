# Caliber cloud stack — API + Postgres + one hourly worker chore.
# Cost-minded: one web (starter) + one cron (starter) + free/basic Postgres.
# Netlify points API_URL at the caliber-api service URL.
#
# After first deploy, set in the dashboard (or CLI):
#   WEB_ORIGIN, ODDS_API_KEY, CFBD_API_KEY

databases:
  - name: caliber-db
    plan: free
    databaseName: caliber
    user: caliber

services:
  - type: web
    name: caliber-api
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /docs
    dockerCommand: sh -c "uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}"
    envVars:
      - key: APP_ENV
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: caliber-db
          property: connectionString
      - key: PARQUET_DIR
        value: /data/parquet
      - key: WEB_ORIGIN
        sync: false
      - key: ODDS_API_KEY
        sync: false
      - key: CFBD_API_KEY
        sync: false
      - key: ODDS_CREDIT_BUDGET_PER_DAY
        value: "2000"
      - key: DISCLAIMER
        value: Research forecast only. Not betting advice. No wagering, no automated placement.
      - key: PYTHONPATH
        value: /app/packages/core:/app/services/api:/app/services/worker

  # Once an hour: ESPN finals, then light ops (odds/settle when due).
  # Keeps one paid cron instead of three.
  - type: cron
    name: caliber-hourly
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    schedule: "15 * * * *"
    dockerCommand: >
      sh -c "python -m worker.main ingest-scoreboard
      && python -m worker.main cfb-atd-ops-cycle --skip-boxes
      && python -m worker.main ingest-odds-live"
    envVars:
      - key: APP_ENV
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: caliber-db
          property: connectionString
      - key: PARQUET_DIR
        value: /data/parquet
      - key: ODDS_API_KEY
        sync: false
      - key: CFBD_API_KEY
        sync: false
      - key: ODDS_CREDIT_BUDGET_PER_DAY
        value: "2000"
      - key: PYTHONPATH
        value: /app/packages/core:/app/services/api:/app/services/worker
