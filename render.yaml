# Caliber cloud API + Postgres.
# Web service should be 1c-2g (2 GB) for public boards. Free sleeps and OOMs.
# After billing is on, the scheduled workers refreshes odds + saved boards in cloud
# so the Windows PC is not required for production.
#
# After deploy, set WEB_ORIGIN / ODDS_API_KEY / CFBD_API_KEY, then point Netlify
# API_URL at this service.

databases:
  - name: caliber-db
    plan: free
    databaseName: caliber
    user: caliber

services:
  - type: web
    name: caliber-api
    runtime: docker
    plan: 1c-2g
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: caliber-db
          property: connectionString
      - key: PARQUET_DIR
        value: /data/parquet
      - key: WEB_ORIGIN
        sync: false
      - key: ODDS_API_KEY
        sync: false
      - key: CFBD_API_KEY
        sync: false
      - key: ODDS_CREDIT_BUDGET_PER_DAY
        value: "2000"
      - key: DISCLAIMER
        value: Research forecast only. Not betting advice. No wagering, no automated placement.
      - key: PYTHONPATH
        value: /app/packages/core:/app/services/api:/app/services/worker

# Production scheduled jobs are managed separately by
# infra/deploy/render-production-jobs.yaml to avoid two Blueprints owning the same jobs.
