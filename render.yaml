# Caliber cloud API + Postgres (free tier).
# Hourly scoreboard/odds stay on the Windows Task Scheduler for $0 until a
# Render payment method is added (cron requires billing). Then add caliber-hourly.
#
# After deploy, set WEB_ORIGIN / ODDS_API_KEY / CFBD_API_KEY, then point Netlify
# API_URL at this service.

databases:
  - name: caliber-db
    plan: free
    databaseName: caliber
    user: caliber

services:
  - type: web
    name: caliber-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /docs
    envVars:
      - key: APP_ENV
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: caliber-db
          property: connectionString
      - key: PARQUET_DIR
        value: /data/parquet
      - key: WEB_ORIGIN
        sync: false
      - key: ODDS_API_KEY
        sync: false
      - key: CFBD_API_KEY
        sync: false
      - key: ODDS_CREDIT_BUDGET_PER_DAY
        value: "2000"
      - key: DISCLAIMER
        value: Research forecast only. Not betting advice. No wagering, no automated placement.
      - key: PYTHONPATH
        value: /app/packages/core:/app/services/api:/app/services/worker
