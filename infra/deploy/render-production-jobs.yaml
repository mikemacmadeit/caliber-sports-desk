# Existing Caliber production workers. Adopt matching jobs; retain the existing API and database.
# API_SPORTS_KEY is optional. Missing coverage is reported; free inputs keep running.
services:
- type: cron
  runtime: docker
  plan: starter
  region: oregon
  repo: https://github.com/mikemacmadeit/caliber-sports-desk
  branch: master
  autoDeployTrigger: checksPass
  dockerfilePath: ./Dockerfile
  dockerContext: .
  name: caliber-hourly
  schedule: '*/5 * * * *'
  dockerCommand: python -m worker.supervise --lane odds --timeout 240
  envVars:
  - key: APP_ENV
    value: prod
  - key: DATABASE_URL
    fromDatabase:
      name: caliber-db-xtkn
      property: connectionString
  - key: PARQUET_DIR
    value: /data/parquet
  - key: PYTHONPATH
    value: /app/packages/core:/app/services/api:/app/services/worker
  - key: ODDS_API_KEY
    fromService:
      name: caliber-api-xtkn
      type: web
      envVarKey: ODDS_API_KEY
  - key: CFBD_API_KEY
    fromService:
      name: caliber-api-xtkn
      type: web
      envVarKey: CFBD_API_KEY
  - key: ODDS_CREDIT_BUDGET_PER_DAY
    value: '2000'
- type: cron
  runtime: docker
  plan: starter
  region: oregon
  repo: https://github.com/mikemacmadeit/caliber-sports-desk
  branch: master
  autoDeployTrigger: checksPass
  dockerfilePath: ./Dockerfile
  dockerContext: .
  name: caliber-scoreboard
  schedule: '*/15 * * * *'
  dockerCommand: python -m worker.supervise --lane settlement --timeout 720
  envVars:
  - key: APP_ENV
    value: prod
  - key: DATABASE_URL
    fromDatabase:
      name: caliber-db-xtkn
      property: connectionString
  - key: PARQUET_DIR
    value: /data/parquet
  - key: PYTHONPATH
    value: /app/packages/core:/app/services/api:/app/services/worker
- type: cron
  runtime: docker
  plan: starter
  region: oregon
  repo: https://github.com/mikemacmadeit/caliber-sports-desk
  branch: master
  autoDeployTrigger: checksPass
  dockerfilePath: ./Dockerfile
  dockerContext: .
  name: caliber-inputs
  schedule: '*/15 * * * *'
  dockerCommand: python -m worker.supervise --lane inputs --timeout 720
  envVars:
  - key: APP_ENV
    value: prod
  - key: DATABASE_URL
    fromDatabase:
      name: caliber-db-xtkn
      property: connectionString
  - key: PARQUET_DIR
    value: /data/parquet
  - key: PYTHONPATH
    value: /app/packages/core:/app/services/api:/app/services/worker
  - key: NWS_USER_AGENT
    value: Caliber Sports Desk (calibersportsbet@gmail.com)

# Separate lane prevents simulation time from delaying odds publication.
- type: cron
  runtime: docker
  plan: 1c-2g
  region: oregon
  repo: https://github.com/mikemacmadeit/caliber-sports-desk
  branch: master
  autoDeployTrigger: checksPass
  dockerfilePath: ./Dockerfile
  dockerContext: .
  name: caliber-touchdowns
  schedule: '2-59/5 * * * *'
  dockerCommand: python -m worker.supervise --lane touchdowns --timeout 240
  envVars:
  - key: APP_ENV
    value: prod
  - key: DATABASE_URL
    fromDatabase:
      name: caliber-db-xtkn
      property: connectionString
  - key: PARQUET_DIR
    value: /data/parquet
  - key: PYTHONPATH
    value: /app/packages/core:/app/services/api:/app/services/worker
