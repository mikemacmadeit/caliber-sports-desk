# Caliber website on Netlify. API + worker live on Render (see render.yaml).
#
# Required env vars in Netlify:
#   API_URL=https://YOUR-caliber-api.onrender.com
#   NEXT_PUBLIC_API_URL=https://YOUR-caliber-api.onrender.com

[build]
  command = "npm run build -w web"
  # Do not set publish — @netlify/plugin-nextjs owns it on Linux cloud builds.

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "22"
